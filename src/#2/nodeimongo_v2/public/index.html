<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista książek</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 30px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        h1 {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Lista książek</h1>

    <table id="tabela">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tytuł</th>
                <th>Autor</th>
                <th>Gatunek</th>
                <th>Rok wydania</th>
                <th>Cena</th>
            </tr>
        </thead>
        <tbody id="tabela-body">
            <!-- Wiersze zostaną wstawione przez JS -->
        </tbody>
    </table>

    <script>
        async function pobierzKsiazki() {
            const res = await fetch('/api/ksiazki');
            const ksiazki = await res.json();
            const tbody = document.getElementById('tabela-body');
            tbody.innerHTML = '';

            ksiazki.forEach(k => {
                const row = document.createElement('tr');
                row.innerHTML = `
                <td>${k.id_ksiazki}</td>
                <td>${k.Tytul}</td>
                <td>${k.Autor}</td>
                <td>${k.Gatunek}</td>
                <td>${k.Rok_wydania}</td>
                <td>${k.Cena}</td>
                `;
                tbody.appendChild(row);
            });
        }

        pobierzKsiazki();
    </script>
</body>
</html>
